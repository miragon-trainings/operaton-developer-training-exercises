server:
  port: 8080

spring:
  datasource:
    # Embedded H2 database, stored as a file in your home directory – nothing to install or start.
    # The engine state survives a restart. To reset: stop the application, delete ~/.operaton-training.
    url: jdbc:h2:file:~/.operaton-training/exercise
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create
  h2:
    console:
      # SQL console in the browser: http://localhost:8080/h2-console (same JDBC URL, user sa, no password)
      enabled: true

# Process-Engine-API (bpm-crafters): engine-neutral orchestration on top of the embedded Operaton engine
dev:
  bpm-crafters:
    process-api:
      worker:
        deployment:
          enabled: true
          bpmnResourcePattern: "classpath*:/**/*.bpmn"
          dmnResourcePattern: "classpath*:/**/*.dmn"
      adapter:
        operaton-embedded:
          enabled: true
          service-tasks:
            delivery-strategy: embedded_scheduled
            worker-id: extra-task-1-worker
            schedule-delivery-fixed-rate-in-seconds: 5
          user-tasks:
            delivery-strategy: embedded_scheduled
            schedule-delivery-fixed-rate-in-seconds: 5

operaton:
  bpm:
    admin-user:
      id: admin
      password: admin
    database:
      type: h2
      schema-update: true
