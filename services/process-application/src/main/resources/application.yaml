#
# It connects the engine to an embedded H2 database (a file in your home directory – nothing to
# install or start), enables the H2 console and creates the Cockpit admin user. Without this
# configuration the application falls back to a throwaway in-memory database: no admin user for
# the Cockpit login, no H2 console, and every process instance is gone after a restart.
#
# The engine runs on port 8080; the H2 console for the engine tables is at /h2-console.

